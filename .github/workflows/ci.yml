name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: mrhm_test
          POSTGRES_USER: mrhm
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pgsql, pdo_pgsql, redis, gd, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: app
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env
        working-directory: app
        run: cp .env.example .env

      - name: Generate key
        working-directory: app
        run: php artisan key:generate

      - name: Configure test DB
        working-directory: app
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^# *DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^# *DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^# *DB_DATABASE=.*/DB_DATABASE=mrhm_test/' .env
          sed -i 's/^# *DB_USERNAME=.*/DB_USERNAME=mrhm/' .env
          sed -i 's/^# *DB_PASSWORD=.*/DB_PASSWORD=secret/' .env
          echo "REDIS_HOST=127.0.0.1" >> .env

      - name: Run migrations
        working-directory: app
        run: php artisan migrate --force

      - name: Pint (code style)
        working-directory: app
        run: ./vendor/bin/pint --test

      - name: PHPStan (Larastan)
        working-directory: app
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Pest tests
        working-directory: app
        run: ./vendor/bin/pest --parallel
